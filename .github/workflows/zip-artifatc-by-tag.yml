name: Zip Artifact by Tag

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '빌드할 upstream 태그 이름을 입력하세요 (예: v1.4.0)'
        required: true
        default: 'v1.4.0'

jobs:
  build:
    runs-on: windows-2022

    steps:
    # 1. 포크 저장소 기본 Checkout (태그 이력 포함)
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. upstream 원격 저장소를 추가하고 요청한 태그 체크아웃
    - name: Fetch Upstream and Checkout Tag
      shell: pwsh
      run: |
        # 원본 저장소 URL (필요 시 실제 upstream URL로 확인/수정)
        $upstreamUrl = "https://github.com/3dmigoto/StereoVisionHacks.git"
        $targetTag = "${{ inputs.tag_name }}"

        Write-Host "Adding upstream repository..."
        git remote add upstream $upstreamUrl 2>$null
        
        Write-Host "Fetching all tags from upstream..."
        git fetch upstream --tags

        Write-Host "Checking out tag: $targetTag"
        git checkout "refs/tags/$targetTag"

    # 3. MSBuild 환경 구성
    - name: Add MSBuild for VS2022 to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '[17.0,18.0)'

    # 4. 솔루션 빌드 (이제 upstream 태그가 존재하므로 generate-version.ps1이 정상 작동)
    - name: Build solution
      run: >
        msbuild StereoVisionHacks.sln
        -property:Configuration="Zip Release"
        -property:Platform=x64
        -target:rebuild
        -verbosity:minimal

    # 5. 빌드 결과물 ZIP 압축
    - name: Zip DLLs
      shell: pwsh
      run: |
        $dll_files = Get-ChildItem -Path './x64/Zip Release' -Filter '*.dll'
        Compress-Archive -Path $dll_files.FullName -DestinationPath './LibrariesTemp.zip'

    # 6. Artifact로 업로드
    - name: Upload Zip Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XXMI-PACKAGE-${{ inputs.tag_name }}
        path: './LibrariesTemp.zip'